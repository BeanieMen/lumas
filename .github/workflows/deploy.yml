name: Deploy Lumas

on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumas-production
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy commits whose CI run on master concluded successfully.
    # Manual dispatch still works and deploys the current master HEAD.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy on a1 and verify health
        env:
          DEPLOY_KEY: ${{ secrets.LUMAS_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.LUMAS_DEPLOY_HOST }}
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp)
          hosts=$(mktemp)
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$DEPLOY_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDT7oJA/vH8PIuoU/UuKfNhCBpLQ8MiCXpL5xkkgMNJ+" > "$hosts"
          # This key can only call the VPS deploy wrapper, not an interactive shell.
          # The wrapper shares the deployment lock and preserves build/health rollback.
          ssh -T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            ubuntu@"$DEPLOY_HOST" "deploy $DEPLOY_SHA"
