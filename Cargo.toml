[package]
name = "mvc_app"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
minijinja = "3.0.4"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }

[profile.dev]
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
