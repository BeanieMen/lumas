<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock title %} - Lumas</title>
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/smooth-cursor.css?v=2">
  {% block css %}{% endblock css %}
</head>
<body>
  {% block body %}{% endblock body %}
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>
  <script type="module">
    import { hoverAudio } from "/hover-audio.js";
    hoverAudio.init();
  </script>
  <script src="/smooth-cursor.js?v=4" defer></script>
</body>
</html>
